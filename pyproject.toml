[project]
name = "codelens"
version = "0.1.0"
description = "Python patch evidence: dependency paths, per-test execution and bounded mutation checks, with MCP tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CodeLens" }]
dependencies = [
    "mcp>=2.0.0,<3",
    "pydantic>=2.7.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "libcst>=1.4.0",
    "click>=8.1.7",
    "coverage>=7.6,<8",
    "pytest>=8.3,<10",
]

[project.scripts]
codelens = "codelens.cli:main"
codelens-mcp = "codelens.mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# We have no class-based tests; the default "Test*" pattern otherwise tries
# (and warns when it fails) to collect result/model classes like TestOutcome,
# TestCaseResult, and TestRunResult in tools/test_runner.py.
python_classes = ["TestSuite*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["codelens"]
ignore_missing_imports = true
